name: Crypto-Analyzer-Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 🔄 إعادة التشغيل تلقائياً كل ساعتين لضمان استمرار البوت
    - cron: '0 */2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyTelegramBotAPI requests numpy ccxt flask telethon

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # تشغيل السكربت مباشرة وبشكل نظيف
          python tawsiaaat1111.py
