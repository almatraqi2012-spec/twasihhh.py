name: Crypto-Analyzer-Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 🔄 تحديث لإعادة التشغيل كل 4 ساعات كمسافة أمان قبل حد الموت (6 ساعات)
    - cron: '0 */4 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pyTelegramBotAPI requests numpy ccxt flask telethon supabase

      - name: Run Bot Permanently
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python tawsiaaat1111.py &
          sleep infinity
